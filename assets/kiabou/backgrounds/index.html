<style>
*{box-sizing:border-box}body{margin:0;background:#f3f2ee;color:#283e4d;font:15px/1.7 system-ui,sans-serif}

body:has(#dim:checked) p,body:has(#dim:checked) .number,body:has(#dim:checked) a{color:#c2ced5}
a:focus-visible,input:focus-visible{outline:3px solid #416d88;outline-offset:5px}
