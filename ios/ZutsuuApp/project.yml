# /Users/mymac/zutsuu/ios/ZutsuuApp/project.yml
# xcodegen の定義。`xcodegen generate` で ZutsuuApp.xcodeproj を作る（生成物は git 管理外）。
# Bundle ID と Team ID をここ 1 箇所に集め、WeatherKit の entitlement と揃えるため。
# 関連: docs/plans/2026-09-09-app-layer-plan2.md Part B, ../ZutsuuKit/Package.swift
name: ZutsuuApp
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  ZutsuuKit:
    path: ../ZutsuuKit

settings:
  base:
    # Apple Developer Program の Team ID。Bundle ID は Developer Portal で
    # App ID として登録し、WeatherKit capability を有効化しておくこと。
    DEVELOPMENT_TEAM: TSYS7S5FCY
    PRODUCT_BUNDLE_IDENTIFIER: com.mintiasaikoh.zutsuu
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  ZutsuuApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: ZutsuuKit
        product: RiskEngine
      - package: ZutsuuKit
        product: PersonalRisk
      - package: ZutsuuKit
        product: KiabouUI
      - package: ZutsuuKit
        product: AppCore
      - target: ZutsuuWatch
    entitlements:
      path: ZutsuuApp.entitlements
      properties:
        com.apple.developer.weatherkit: true
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: zutsuu
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: 現在地の気象予報を取得するために使います。位置情報は端末の外へ送られません（Apple Weather への座標送信のみ）。
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.mintiasaikoh.zutsuu.refresh]

  # Plan 5: Watch アプリ（単一ターゲット形式）。予報は取らず、iPhone の要約表示と 1 タップ記録だけ。
  ZutsuuWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: ../ZutsuuWatch/Sources
    dependencies:
      - package: ZutsuuKit
        product: RiskEngine
      - package: ZutsuuKit
        product: KiabouUI
      - package: ZutsuuKit
        product: AppCore
      - target: ZutsuuWatchWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mintiasaikoh.zutsuu.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
    entitlements:
      path: ../ZutsuuWatch/ZutsuuWatch.entitlements
    info:
      path: ../ZutsuuWatch/Info.plist
      properties:
        CFBundleDisplayName: zutsuu
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.mintiasaikoh.zutsuu
        WKRunsIndependentlyOfCompanionApp: false

  ZutsuuWatchWidget:
    type: app-extension
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: ../ZutsuuWatchWidget/Sources
    dependencies:
      - package: ZutsuuKit
        product: RiskEngine
      - package: ZutsuuKit
        product: AppCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mintiasaikoh.zutsuu.watchkitapp.complication
        TARGETED_DEVICE_FAMILY: "4"
    entitlements:
      path: ../ZutsuuWatchWidget/ZutsuuWatchWidget.entitlements
    info:
      path: ../ZutsuuWatchWidget/Info.plist
      properties:
        CFBundleDisplayName: zutsuu
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
