name: 気圧チェック

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 * * * *"    # 毎時（アラート用）→ JST 毎時09分頃
    - cron: "30 22 * * *"  # 朝の予報バックアップ1 → JST 07:30
    - cron: "0 0 * * *"    # 朝の予報メイン       → JST 09:00
    - cron: "30 0 * * *"   # 朝の予報バックアップ2 → JST 09:30
  workflow_dispatch: # 手動実行用

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Get today's date (JST)
        id: jst-date
        run: echo "today=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT
        env:
          TZ: Asia/Tokyo

      - name: Restore morning briefing cache
        id: morning-cache
        uses: actions/cache/restore@v4
        with:
          path: .morning-sent
          key: morning-briefing-${{ steps.jst-date.outputs.today }}

      - name: Check pressure
        run: npm run check
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          TZ: Asia/Tokyo
          BRIEFING_SENT_TODAY: ${{ steps.morning-cache.outputs.cache-hit }}

      - name: Save morning briefing cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .morning-sent
          key: morning-briefing-${{ steps.jst-date.outputs.today }}
