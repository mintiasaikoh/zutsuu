name: RiskEngine（Swift パッケージ）

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: ios/ZutsuuKit

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # ランナー既定の Xcode が最新とは限らない。Package.swift は
      # swift-tools-version 6.2 を要求するので、入っている中で最も新しいものを選ぶ。
      - name: Select newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          swift --version

      # Package.swift の treatAllWarnings(as: .error) は RiskEngine ターゲットにしか
      # 掛かっていないので、テストコードには -Xswiftc で掛ける。
      # --build-tests が必須。swift build は既定でテストターゲットを作らないため、
      # 付けないとテストコードの警告が素通りする
      # （実測: テストファイルの未使用変数があっても exit 0 になる）。
      - name: Build (warnings as errors)
        run: swift build --build-tests -Xswiftc -warnings-as-errors

      - name: Test (debug)
        run: swift test

      # release でのみ落ちる差異が過去に一度発生している（#if DEBUG の扱い）。
      # 両構成を回す。
      - name: Test (release)
        run: swift test -c release

      # swift test は macOS ネイティブでしか走らない。実際の配布先は iOS と watchOS
      # なので、macOS にしか無い API が紛れ込んでもここまでの手順では気付けない
      # （Plan 2・Plan 5 でアプリに組み込むまで表面化しない）。両プラットフォーム向けの
      # ビルドを通しておく。scheme 名は product 名の RiskEngine ではなくパッケージ名。
      - name: Build (iOS)
        run: xcodebuild build -scheme ZutsuuKit -destination 'generic/platform=iOS'

      - name: Build (watchOS)
        run: xcodebuild build -scheme ZutsuuKit -destination 'generic/platform=watchOS'
