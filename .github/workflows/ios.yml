name: RiskEngine（Swift パッケージ）

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: ios/ZutsuuKit

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # ランナー既定の Xcode が最新とは限らない。Package.swift は
      # swift-tools-version 6.2 を要求するので、入っている中で最も新しいものを選ぶ。
      - name: Select newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          swift --version

      # Package.swift の treatAllWarnings(as: .error) は RiskEngine ターゲットにしか
      # 掛かっていないので、テストコードには -Xswiftc で掛ける。
      # --build-tests が必須。swift build は既定でテストターゲットを作らないため、
      # 付けないとテストコードの警告が素通りする
      # （実測: テストファイルの未使用変数があっても exit 0 になる）。
      - name: Build (warnings as errors)
        run: swift build --build-tests -Xswiftc -warnings-as-errors

      - name: Test (debug)
        run: swift test

      # release でのみ落ちる差異が過去に一度発生している（#if DEBUG の扱い）。
      # 両構成を回す。
      - name: Test (release)
        run: swift test -c release

      # 広告パッケージ（ZutsuuAds）。頻度制御の純粋ロジック（AdPolicy）だけ macOS でテストできる。
      # Google Mobile Ads SDK は iOS 条件付き依存なので、ここでは解決されるだけで結びつかない。
      - name: Test ads policy
        working-directory: ios/ZutsuuAds
        run: swift test --filter AdPolicyTests

      # swift test は macOS ネイティブでしか走らない。実際の配布先は iOS と watchOS
      # なので、macOS にしか無い API が紛れ込んでもここまでの手順では気付けない
      # （Plan 2・Plan 5 でアプリに組み込むまで表面化しない）。両プラットフォーム向けの
      # ビルドを通しておく。scheme 名は product 名ではなく自動生成の集約スキーム。
      # product が 1 つの間は「ZutsuuKit」だったが、複数化で
      # 「ZutsuuKit-Package」に変わった（Xcode の命名規則）。
      - name: Build (iOS)
        run: xcodebuild build -scheme ZutsuuKit-Package -destination 'generic/platform=iOS'

      - name: Build (watchOS)
        run: xcodebuild build -scheme ZutsuuKit-Package -destination 'generic/platform=watchOS'

      # アプリ本体（ios/ZutsuuApp）。project.yml から xcodegen で生成し、
      # シミュレータ向けに署名なしでビルドする。パッケージの公開 API 変更で
      # アプリ側が壊れるのをここで検出する。WeatherKit の実行は CI では検証できない。
      - name: Build app (iOS Simulator)
        working-directory: ios/ZutsuuApp
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild build -project ZutsuuApp.xcodeproj -scheme ZutsuuApp \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
